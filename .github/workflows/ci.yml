name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: securebank
          POSTGRES_USER: securebank
          POSTGRES_PASSWORD: securebankpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securebank -d securebank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
