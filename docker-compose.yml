
services:
  postgres:
    image: postgres:16-alpine
    container_name: securebank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    # Do not expose PostgreSQL publicly unless required.
    # Uncomment only if you specifically need host access.
    # ports:
    #   - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d securebank"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: securebank-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: securebank
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}

    ports:
      - "3000:3000"

volumes:
  postgres_data:
