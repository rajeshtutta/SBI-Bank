services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebankpass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: change-this-in-real-deployment
      DATABASE_URL: postgresql://securebank:securebankpass@postgres:5432/securebank
    ports:
      - "3000:3000"

volumes:
  postgres_data:
